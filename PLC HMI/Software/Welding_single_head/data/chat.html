<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Haffler Voice AI">
    <meta name="format-detection" content="telephone=no">
    <title>دستیار صوتی و هوشمند هافلر | Haffler Voice AI</title>
    <style>
        :root {
            --bg-dark: #0a0f18;
            --bg-card: rgba(18, 26, 41, 0.85);
            --accent-teal: #00d2b4;
            --accent-cyan: #00b4d8;
            --accent-glow: rgba(0, 210, 180, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-card: rgba(255, 255, 255, 0.08);
            --danger-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #070b12 0%, #0f172a 100%);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header */
        header {
            background: rgba(10, 15, 24, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-card);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .back-btn:active { transform: scale(0.92); background: rgba(0, 210, 180, 0.2); }
        .header-title h1 { font-size: 0.98rem; font-weight: 700; color: #fff; line-height: 1.2; }
        .header-title p { font-size: 0.72rem; color: var(--accent-teal); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #00e676; box-shadow: 0 0 8px #00e676; }
        .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        /* Header Right / Telemetry & TTS Controls */
        .header-right { display: flex; align-items: center; gap: 6px; }
        .tts-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-card);
            color: var(--accent-teal);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.15s;
        }
        .tts-btn.muted { color: #64748b; opacity: 0.6; }
        .tts-btn:active { transform: scale(0.92); }

        .telemetry-bar { display: flex; gap: 6px; align-items: center; }
        .telem-pill {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 4px 8px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }
        .telem-pill span.val { color: #38bdf8; font-weight: 700; }

        /* Listening Banner / Audio Wave */
        #voiceWave {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(239, 68, 68, 0.14);
            border-bottom: 1px solid rgba(239, 68, 68, 0.3);
            animation: fadeIn 0.2s ease-out;
        }
        .wave-text { font-size: 0.8rem; color: #fca5a5; font-weight: 600; margin-left: 8px; }
        .wave-bar {
            width: 3px; height: 16px; background: #ef4444; border-radius: 2px;
            animation: waveMotion 0.8s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 22px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 12px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 26px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 18px; }
        @keyframes waveMotion {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        /* Chat Body */
        main.chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
            animation: msgPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes msgPop {
            0% { opacity: 0; transform: translateY(8px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.bot {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-bottom-right-radius: 4px;
            color: #e2e8f0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 16px rgba(0, 180, 216, 0.3);
        }

        /* Action Cards in Chat */
        .chat-action-card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(0, 210, 180, 0.35);
            border-radius: 14px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-action-card .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-teal);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-action-card .card-desc { font-size: 0.78rem; color: #94a3b8; line-height: 1.5; }
        .card-act-btn {
            background: linear-gradient(135deg, #00d2b4, #00897b);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.15s;
            box-shadow: 0 2px 8px rgba(0, 210, 180, 0.3);
        }
        .card-act-btn:active { transform: scale(0.95); }

        /* Suggestion Chips */
        .chips-bar {
            padding: 8px 14px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: rgba(10, 15, 24, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            scrollbar-width: none;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .chips-bar::-webkit-scrollbar { display: none; }
        .chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            color: #cbd5e1;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip:hover, .chip:active {
            background: rgba(0, 210, 180, 0.2);
            border-color: var(--accent-teal);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Input Area & Mic Button */
        footer.chat-input-area {
            background: rgba(10, 15, 24, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border-card);
            padding: 10px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .mic-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
            outline: none;
        }
        .mic-btn:active { transform: scale(0.92); }
        .mic-btn.recording {
            background: var(--danger-red);
            border-color: #f87171;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
            animation: micPulse 1.2s infinite ease-in-out;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .input-wrapper { flex: 1; position: relative; }
        .chat-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
            direction: rtl;
        }
        .chat-input:focus {
            border-color: var(--accent-teal);
            background: rgba(255, 255, 255, 0.09);
        }
        .send-btn {
            background: linear-gradient(135deg, #00d2b4, #009688);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 2px 12px rgba(0, 210, 180, 0.35);
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.92); }
        .send-btn svg { width: 20px; height: 20px; transform: rotate(180deg); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="back-btn" onclick="handleChatBack()" title="بازگشت به داشبورد">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="header-title">
                <h1>دستیار صوتی و هوشمند هافلر</h1>
                <p><span class="status-dot" id="connDot"></span><span id="connText">متصل به PLC جوش تک‌سر</span></p>
            </div>
        </div>

        <div class="header-right">
            <button id="ttsToggleBtn" class="tts-btn" onclick="toggleTts()" title="پخش صوتی پاسخ‌ها">🔊</button>
            <div class="telemetry-bar">
                <div class="telem-pill"><span>اتو:</span><span id="TM" class="val">--</span>°C</div>
                <div class="telem-pill"><span>برنامه:</span><span id="current_P" class="val">P1</span></div>
            </div>
        </div>
    </header>

    <!-- Hidden compatibility markers for chatbot telemetry -->
    <div style="display:none;">
        <span id="current_T">250</span>
        <span id="current_H">25</span>
        <span id="current_L">30</span>
        <span id="WM">--</span>
        <span id="Ws">--</span>
        <span id="activ_date">1403/06/10</span>
    </div>

    <!-- Live Voice Listening Waveform -->
    <div id="voiceWave">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <span class="wave-text">🎙️ در حال گوش دادن... صحبت کنید</span>
    </div>

    <main id="chatBody" class="chat-body"></main>

    <div id="chipsContainer" class="chips-bar"></div>

    <footer class="chat-input-area">
        <button id="micBtn" class="mic-btn" onclick="toggleVoiceRecording()" title="فرمان صوتی">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>
        <div class="input-wrapper">
            <input type="text" id="chatInput" class="chat-input" placeholder="فرمان صوتی بگویید یا بنویسید..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()" title="ارسال">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </footer>

    <!-- Dual WebSocket, Voice AI Engine & Audio TTS -->
    <script>
        function handleChatBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        var ws = null;
        function initChatWS() {
            var host = window.location.hostname || '192.168.4.1';
            var port = (window.location.port === '8080') ? 81 : 81;
            var wsUrl = 'ws://' + host + ':' + port + '/';

            try {
                ws = new WebSocket(wsUrl, ['arduino']);
                window.ws = ws;
                window.connection = ws;

                ws.onopen = function() {
                    var dot = document.getElementById('connDot');
                    var txt = document.getElementById('connText');
                    if (dot) { dot.classList.remove('disconnected'); }
                    if (txt) { txt.innerText = 'متصل به PLC جوش تک‌سر'; }
                };

                ws.onmessage = function(e) {
                    try {
                        var d = JSON.parse(e.data);
                        if (d.DID === 555) {
                            if (d.TM !== undefined) {
                                window.current_temp = parseInt(d.TM, 10);
                                var el = document.getElementById('TM');
                                if (el) el.innerText = d.TM;
                            }
                            if (d.T !== undefined) {
                                var elT = document.getElementById('current_T');
                                if (elT) elT.innerText = d.T;
                                if (!window.selectedProgram) window.selectedProgram = {};
                                window.selectedProgram.t = parseInt(d.T, 10);
                            }
                            if (d.H !== undefined) {
                                var elH = document.getElementById('current_H');
                                if (elH) elH.innerText = d.H;
                                if (!window.selectedProgram) window.selectedProgram = {};
                                window.selectedProgram.h = parseInt(d.H, 10);
                            }
                            if (d.L !== undefined) {
                                var elL = document.getElementById('current_L');
                                if (elL) elL.innerText = d.L;
                                if (!window.selectedProgram) window.selectedProgram = {};
                                window.selectedProgram.l = parseInt(d.L, 10);
                            }
                            if (d.PU !== undefined) {
                                var elP = document.getElementById('current_P');
                                if (elP) elP.innerText = 'P' + d.PU;
                                if (!window.selectedProgram) window.selectedProgram = {};
                                window.selectedProgram.id = parseInt(d.PU, 10);
                            }
                            if (d.WM !== undefined && document.getElementById('WM')) document.getElementById('WM').innerText = d.WM;
                            if (d.Ws !== undefined && document.getElementById('Ws')) document.getElementById('Ws').innerText = d.Ws;
                        }
                    } catch(err) {}
                };

                ws.onclose = function() {
                    var dot = document.getElementById('connDot');
                    var txt = document.getElementById('connText');
                    if (dot) { dot.classList.add('disconnected'); }
                    if (txt) { txt.innerText = 'در حال تلاش مجدد...'; }
                    setTimeout(initChatWS, 2500);
                };
            } catch(e) {
                setTimeout(initChatWS, 3000);
            }
        }
        initChatWS();

        function appendMessage(text, isUser, isHtml) {
            var body = document.getElementById('chatBody');
            if (!body) return;
            var div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user' : 'bot');
            if (isHtml) {
                div.innerHTML = text;
            } else {
                div.textContent = text;
            }
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        function renderChips(chips) {
            var bar = document.getElementById('chipsContainer');
            if (!bar) return;
            bar.innerHTML = '';
            chips.forEach(function(c) {
                var btn = document.createElement('div');
                btn.className = 'chip';
                btn.textContent = c;
                btn.onclick = function() {
                    var inp = document.getElementById('chatInput');
                    if (inp) { inp.value = c; sendMessage(); }
                };
                bar.appendChild(btn);
            });
        }

        // ── Speech Synthesis (TTS) Engine ──────────────────────────────────────────
        var ttsEnabled = true;
        function toggleTts() {
            ttsEnabled = !ttsEnabled;
            var btn = document.getElementById('ttsToggleBtn');
            if (btn) {
                btn.innerText = ttsEnabled ? '🔊' : '🔇';
                btn.classList.toggle('muted', !ttsEnabled);
            }
            if (!ttsEnabled && window.speechSynthesis) {
                try { window.speechSynthesis.cancel(); } catch(e) {}
            }
        }

        function cleanSpeechText(txt) {
            if (!txt) return '';
            return txt
                .replace(/<[^>]+>/g, '') // remove html
                .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '') // remove emojis
                .replace(/(\d+)\s*°\s*C/g, '$1 درجه سانتی‌گراد')
                .replace(/(\d+)\s*°/g, '$1 درجه')
                .replace(/(\d+)\s*s\b/gi, '$1 ثانیه')
                .replace(/(\d+)\s*mm\b/gi, '$1 میلی‌متر')
                .replace(/(\d+)\s*bar\b/gi, '$1 بار')
                .replace(/\bPLC\b/gi, 'پی‌ال‌سی')
                .replace(/\bHMI\b/gi, 'اچ‌ام‌آی')
                .replace(/\bSSR\b/gi, 'اس‌اس‌آر')
                .replace(/\bPID\b/gi, 'پی‌آی‌دی')
                .replace(/\bMAX6675\b/gi, 'ماکس ۶۶ ۷۵')
                .replace(/\bE-Stop\b/gi, 'استاپ اضطراری')
                .replace(/\bUPVC\b/gi, 'یو پی وی سی')
                .replace(/P([1-5])\b/g, 'برنامه $1')
                .trim();
        }

        function speakBot(text) {
            if (!ttsEnabled || !window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                var clean = cleanSpeechText(text);
                if (!clean) return;
                var sentences = clean.split(/[\n.!؟؛]/).filter(x => x.trim().length > 3);
                var toSpeak = sentences.length > 0 ? sentences[0].trim() : clean;
                if (toSpeak.length > 180) toSpeak = toSpeak.substring(0, 180);

                var u = new SpeechSynthesisUtterance(toSpeak);
                u.lang = 'fa-IR';
                u.rate = 1.0;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            } catch(e) {}
        }
        window.appendMessage = appendMessage;
        window.speakBot = speakBot;

        // ── Web Speech API Recognition (Mic Input) ─────────────────────────────────
        var recognition = null;
        var isRecording = false;

        function initSpeech() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            try {
                var rec = new SpeechRecognition();
                rec.lang = 'fa-IR';
                rec.continuous = false;
                rec.interimResults = false;

                rec.onstart = function() {
                    isRecording = true;
                    var btn = document.getElementById('micBtn');
                    if (btn) btn.classList.add('recording');
                    var wave = document.getElementById('voiceWave');
                    if (wave) wave.style.display = 'flex';
                    var inp = document.getElementById('chatInput');
                    if (inp) inp.placeholder = '🎙️ در حال گوش دادن... صحبت کنید';
                    try { if (navigator.vibrate) navigator.vibrate(60); } catch(e) {}
                };

                rec.onresult = function(ev) {
                    var transcript = ev.results[0][0].transcript;
                    var inp = document.getElementById('chatInput');
                    if (inp) inp.value = transcript;
                    stopVoiceRecording();
                    sendMessage();
                };

                rec.onerror = function(ev) {
                    stopVoiceRecording();
                };

                rec.onend = function() {
                    stopVoiceRecording();
                };
                return rec;
            } catch(e) {
                return null;
            }
        }

        function toggleVoiceRecording() {
            if (!recognition) {
                recognition = initSpeech();
            }
            if (!recognition) {
                appendMessage('⚠️ مرورگر گوشی شما دسترسی صوتی روی شبکه محلی (HTTP) را مسدود کرده است.\nمی‌توانید پیام خود را تایپ کرده یا از گزینه‌های آماده زیر استفاده فرمایید.', false);
                return;
            }
            if (isRecording) {
                stopVoiceRecording();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    stopVoiceRecording();
                }
            }
        }

        function stopVoiceRecording() {
            isRecording = false;
            var btn = document.getElementById('micBtn');
            if (btn) btn.classList.remove('recording');
            var wave = document.getElementById('voiceWave');
            if (wave) wave.style.display = 'none';
            var inp = document.getElementById('chatInput');
            if (inp) inp.placeholder = 'فرمان صوتی بگویید یا بنویسید...';
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function sendMessage() {
            var inp = document.getElementById('chatInput');
            if (!inp || !inp.value.trim()) return;
            var txt = inp.value.trim();
            inp.value = '';
            appendMessage(txt, true, false);

            setTimeout(function() {
                if (window.HafflerChatbot && window.HafflerChatbot.process) {
                    var res = window.HafflerChatbot.process(txt);
                    var hasHtml = res.reply && res.reply.includes('<div class="chat-action-card"');
                    appendMessage(res.reply, false, hasHtml);
                    renderChips(res.chips || []);
                    speakBot(res.reply);
                }
            }, 180);
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (window.HafflerChatbot && window.HafflerChatbot.I18N) {
                    var dict = window.HafflerChatbot.I18N.FA;
                    appendMessage(dict.greeting, false, false);
                    renderChips(dict.chips);
                }
            }, 200);
        });
    </script>
    <script src="chatbot.js"></script>
</body>
</html>
