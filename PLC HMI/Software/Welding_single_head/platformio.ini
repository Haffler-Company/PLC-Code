; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 921600
upload_speed = 460800
upload_port = COM5
upload_protocol = esptool
monitor_rts = 0
monitor_dtr = 0
board_upload.wait_for_upload_port = 20
upload_flags = 
	--before=default_reset
	--after=hard_reset
lib_ldf_mode = deep
build_src_filter = 
	+<*>
	-<ui_image_splash.c>
	-<ui_image_bitmap_splash.c>
extra_scripts = 
	pre:tools/gen_build_time.py
	pre:tools/build_img_map.py
	pre:tools/prepare_spiffs_data.py
	pre:tools/wait_upload_port.py
	post:tools/copy_release_artifacts.py
	post:tools/fix_compile_commands_for_clang.py
build_flags = 
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TOUCH_CS=-1
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_CS=13
	-D TFT_DC=14
	-D TFT_RST=-1
	-D TFT_BL=-1
	-D TFT_MISO=11
	-D TFT_MOSI=10
	-D TFT_SCLK=12
	-D SPI_FREQUENCY=80000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_ARCH_ESP32
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
platform_packages = 
	platformio/tool-esptoolpy@~1.40501.0
