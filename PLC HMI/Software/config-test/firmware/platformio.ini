; PlatformIO configuration for HAFFLER HT-V3A config launcher.
; Bottom bar:
;   check mark = Build
;   right arrow = Upload / Flash

[platformio]
default_envs = ht_v3a
src_dir = .

[env:ht_v3a]
platform = espressif32
board = esp32-s3-devkitc1-n16r2
framework = arduino

upload_port = COM8
monitor_port = COM8
upload_speed = 921600
monitor_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = config/partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = dio_qspi

board_upload.flash_size = 16MB
lib_ldf_mode = deep
extra_scripts = scripts/reset_otadata.py

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH=\"config/lv_conf.h\"
    -D USER_SETUP_LOADED
    -D TFT_SETUP_LOADED
    -D HMI_PERF_SERIAL_LOG=0
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include
    -I include/app
    -I include/ui
    -I include/drivers
    -I src
    -I .
    -I config
    -include include/app/tft_setup.h
    -Wl,--no-warn-execstack  ; suppress هشدار .note.GNU-stack از libc آبجکت‌ها

; EEZ-generated sources live under include/ — pull them into the build
; (PlatformIO only compiles src_dir; src_dir is "." so these filters can reach them)
build_src_filter =
    +<config_hwtest.ino.cpp>
    +<src/>
    +<include/app/*.c>
    +<include/ui/*.c>
    +<include/ui/*.cpp>

lib_deps =
    ; Offline build (no registry access): local copies.
    ; lvgl 9.4.0 from the Welding project; the rest from the shared Software/libraries.
    ; Adafruit_BusIO comes before RTClib to satisfy local dependency
    file://../../Welding_single_head/lib/lvgl
    file://../../libraries/TFT_eSPI
    file://../../libraries/bb_captouch
    file://../../libraries/Adafruit_BusIO
    file://../../libraries/RTClib
    file://../libraries/MAX6675_library
