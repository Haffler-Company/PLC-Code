<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>List screen designer 480x320</title>
<style>
body{margin:0;background:#2c2c2e;font-family:Tahoma,sans-serif;color:#fff}
h1{font-size:13px;margin:12px 16px;color:#aaa}
#screen{width:480px;height:320px;margin:0 16px 16px;background:#cfd8dc;border-radius:4px;position:relative;overflow:hidden;color:#1c1c1e}
.hdr{height:52px;display:flex;align-items:center;gap:6px;padding:6px 8px}
.chip{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.blue{background:#0A84FF}.green{background:#34C759}.red{background:#B90000}.orange{background:#FF9500}.gray{background:#78909c}
.title{flex:1;height:40px;background:#fff;border-radius:12px;display:grid;place-items:center;font:700 16px Tahoma}
.cols{height:22px;display:flex;padding:0 12px 0 48px;font:600 11px Tahoma;color:#546e7a}
.cols span{flex:1}
.body{padding:2px 8px}
.row{height:44px;margin:3px 0;border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 8px}
.row:nth-child(even){background:#e3f2fd}
.idx{width:36px;height:28px;border-radius:8px;background:#1C9B67;color:#fff;display:grid;place-items:center;font:700 12px Consolas}
.meter,.cnt{flex:1;text-align:center;font:700 22px Consolas}
.x{width:16px;text-align:center;color:#90a4ae;font-weight:800}
.page{min-width:48px;text-align:center;font:700 12px Tahoma;color:#0A84FF}
</style>
</head>
<body>
<h1>List designer — LIST_MAX 100 / 5 rows visible (firmware twin)</h1>
<div id="screen">
  <div class="hdr">
    <div class="chip blue">H</div>
    <div class="chip blue">&lt;</div>
    <div class="page">top 0/0</div>
    <div class="chip blue">&gt;</div>
    <div class="title">Cut List</div>
    <div class="chip orange">OPT</div>
    <div class="chip red">T</div>
    <div class="chip green">+</div>
    <div class="chip gray">-</div>
  </div>
  <div class="cols"><span>Length</span><span>Qty</span></div>
  <div class="body">
    <div class="row"><div class="idx">01</div><div class="meter">2000</div><div class="x">x</div><div class="cnt">6</div></div>
    <div class="row"><div class="idx">02</div><div class="meter">1500</div><div class="x">x</div><div class="cnt">10</div></div>
    <div class="row"><div class="idx">03</div><div class="meter">580</div><div class="x">x</div><div class="cnt">20</div></div>
    <div class="row"><div class="idx">04</div><div class="meter">860</div><div class="x">x</div><div class="cnt">8</div></div>
    <div class="row"><div class="idx">05</div><div class="meter">1200</div><div class="x">x</div><div class="cnt">6</div></div>
  </div>
</div>
</body>
</html>
