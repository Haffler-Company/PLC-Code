<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>Main screen designer 480x320</title>
<style>
body{margin:0;background:#2c2c2e;font-family:Tahoma,sans-serif;color:#fff}
h1{font-size:13px;margin:12px 16px;color:#aaa}
#screen{width:480px;height:320px;margin:0 16px;background:#9e9e9e;border-radius:4px;position:relative;overflow:hidden}
.disk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;background:#fff}
.plus{position:absolute;left:18px;top:18px;font:800 28px Tahoma;color:#0A84FF}
.gear{position:absolute;right:18px;top:18px;font:800 24px Tahoma;color:#546e7a}
.sp{position:absolute;left:70px;top:22px;width:110px;height:36px;background:#eceff1;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 22px Consolas;color:#0A84FF}
.hero{position:absolute;left:0;right:0;top:92px;text-align:center;font:700 72px/1 Consolas;color:#c62828}
.u{font:600 16px Tahoma;color:#0A84FF;margin-right:6px;vertical-align:super}
.pcs{position:absolute;left:40px;right:40px;bottom:48px;display:flex;justify-content:space-between;color:#90caf9;font:700 14px Tahoma}
.dash{color:#37474f;letter-spacing:2px}
</style>
</head>
<body>
<h1>Main designer — position hero + setpoint</h1>
<div id="screen">
  <div class="disk">
    <div class="plus">+</div>
    <div class="sp">60 <span style="font:600 12px Tahoma;color:#607d8b">mm</span></div>
    <div class="gear">S</div>
    <div class="hero">4165<span class="u">mm</span></div>
    <div class="pcs"><span>X</span><span class="dash">-- -- --</span><span>PCS</span></div>
  </div>
</div>
</body>
</html>
