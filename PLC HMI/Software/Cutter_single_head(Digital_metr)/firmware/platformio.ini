[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
; پلتفرم پین‌شده به نسخهٔ 55.03.39 (کپی محلی) — فریمورک arduino-esp32 3.3.9 را نصب می‌کند؛
; آخرین نسخه‌ای که میزبان USB (کیبرد) سالم بود. stable شناور به 3.3.11 رفت و کیبرد را شکست (2026-08-23)
platform = file://../tools/platform-espressif32-55.03.39
board = esp32-s3-devkitc1-n16r2
framework = arduino
lib_extra_dirs = ../libraries
; LVGL بعد از پاک‌سازی ~32MB است؛ file:// کپی قابل‌اعتماد می‌سازد
lib_ldf_mode = chain
lib_deps =
    file://../libraries/bb_captouch
    file://../libraries/TFT_eSPI
    file://../libraries/EspUsbHost
    file://../libraries/lvgl
    ; کتابخانه‌های built-inِ arduino-esp32 برای OTAِ اینترنتی (update_flow.h).
    ; صرفِ -I کافی نیست؛ باید در lib_deps باشند تا .cpp آن‌ها هم کامپایل/لینک شود.
    HTTPClient
    HTTPUpdate
    NetworkClientSecure
    ESPmDNS
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_ota7m.csv
board_build.filesystem = spiffs
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
upload_speed = 921600
; پورت روزمره را با tools/fast_firmware.ps1 بده (auto CP210x). COM4 اینجا فقط پیش‌فرض PIO است.
upload_port = COM4
monitor_port = COM4
monitor_speed = 921600
upload_protocol = esptool
build_flags =
    -Iinclude/ui
    -Iinclude/app
    -Iinclude/tasks
    -Iinclude/drivers
    -Iconfig
    -I../libraries/TFT_eSPI
    -I../libraries/lvgl/src
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/lvgl/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/Preferences/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/Update/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/DNSServer/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/HTTPClient/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/HTTPUpdate/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-v3/libraries/NetworkClientSecure/src
    -include include/version.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DARDUINO_I2C_USE_LEGACY
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; LVGL: LV_PART_* | LV_STATE_* روی GCC14 هزاران warning می‌سازد — باگ نیست
    -Wno-deprecated-enum-enum-conversion
    -Wno-deprecated-volatile
    -Wno-enum-compare
; فونت‌های بلااستفاده / جایگزین‌شده — آزادسازی فلش بدون تغییر سناریوی عادی
build_src_filter =
    +<*>
    -<ui/fonts/ui_font_digit100.c>
    -<ui/fonts/ui_font_digit60.c>
    -<ui/fonts/ui_font_digit140.c>
    -<ui/fonts/ui_font_montseraat30.c>
    -<ui/fonts/ui_font_titr30.c>
