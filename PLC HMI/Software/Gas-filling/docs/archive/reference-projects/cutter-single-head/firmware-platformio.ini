[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ../libraries
; LVGL بعد از پاک‌سازی ~32MB است؛ file:// کپی قابل‌اعتماد می‌سازد
lib_ldf_mode = chain
lib_deps =
    file://../libraries/bb_captouch
    file://../libraries/TFT_eSPI
    file://../libraries/EspUsbHost
    file://../libraries/lvgl
    ; کتابخانه‌های built-inِ arduino-esp32 برای OTAِ اینترنتی (update_flow.h).
    ; صرفِ -I کافی نیست؛ باید در lib_deps باشند تا .cpp آن‌ها هم کامپایل/لینک شود.
    HTTPClient
    HTTPUpdate
    NetworkClientSecure
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb_nvs64.csv
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_protocol = esptool
build_flags =
    -Iinclude/ui
    -Iinclude/app
    -Iinclude/tasks
    -Iinclude/drivers
    -Iconfig
    -I../libraries/TFT_eSPI
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Preferences/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Update/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/DNSServer/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/HTTPClient/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/HTTPUpdate/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -include include/version.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DARDUINO_I2C_USE_LEGACY
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; LVGL: LV_PART_* | LV_STATE_* روی GCC14 هزاران warning می‌سازد — باگ نیست
    -Wno-deprecated-enum-enum-conversion
    -Wno-deprecated-volatile
    -Wno-enum-compare
