; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; platform: 6.9.0 — عمداً ثابت (ارتقا به 7.x بعد از تست میدانی؛ UPGRADE_PLAN_FA.md)
; lib/WebSockets 2.7.3 = آخرین 2.x | lib/TFT_eSPI 2.5.43 = آخرین registry
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
lib_ldf_mode = deep
; اسپلش‌های قدیمی EEZ (img_splash / img_bitmap_splash) ~۹۰۰KB — UI از splash_a/b استفاده می‌کند
build_src_filter =
	+<*>
	-<ui_image_splash.c>
	-<ui_image_bitmap_splash.c>
; تولید تاریخ/ساعتِ لحظهٔ بیلد + آماده‌سازی SPIFFS از All data
extra_scripts =
	pre:tools/gen_build_time.py
	pre:tools/prepare_spiffs_data.py
	post:tools/copy_release_artifacts.py
; All required third-party libraries are vendored inside ./lib
; to keep the project self-contained and reproducible offline.
build_flags = 
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TOUCH_CS=-1
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_CS=13
	-D TFT_DC=14
	-D TFT_RST=-1
	-D TFT_BL=-1
	-D TFT_MISO=11
	-D TFT_MOSI=10
	-D TFT_SCLK=12
	-D SPI_FREQUENCY=80000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_ARCH_ESP32
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections

