; Haffler Industrial Universal PlatformIO Configuration
; ESP32-S3-WROOM-1 (N16R8) - 16MB Octal Flash, 8MB Octal PSRAM, LVGL 9, TFT_eSPI

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino

; Relative path to shared libraries
lib_extra_dirs = 
    C:/Users/Haffler/Documents/Haffler/PLC/PLC HMI/Software/libraries

board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi

upload_speed = 921600
monitor_speed = 921600
upload_protocol = esptool

build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TOUCH_CS=-1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_CS=13
    -D TFT_DC=14
    -D TFT_RST=-1
    -D TFT_BL=38
    -D TFT_MISO=11
    -D TFT_MOSI=10
    -D TFT_SCLK=12
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT
    -D CORE_DEBUG_LEVEL=0
    -O2
    -Wno-deprecated-enum-enum-conversion
