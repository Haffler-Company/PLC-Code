<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HAFFLER SMART INDUSTRIAL PORTAL</title>
<style>
:root{--bg:#0a0c10;--card:#161b22;--card-border:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#0ea5e9;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.container{width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--card-border);border-radius:14px}
.brand{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--text);display:flex;align-items:center;gap:8px}
.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.badge-run{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.4)}
.badge-idle{background:rgba(14,165,233,0.15);color:var(--accent);border:1px solid rgba(14,165,233,0.4)}
.badge-stop{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.4)}
.hero-card{background:linear-gradient(180deg,#1c2128 0%,#161b22 100%);border:1px solid var(--card-border);border-radius:18px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.hero-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.hero-val{font-size:54px;font-weight:800;color:#fff;line-height:1.1;margin:6px 0;letter-spacing:-1px}
.hero-unit{font-size:16px;color:var(--accent);font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px}
.sub-title{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.sub-val{font-size:24px;font-weight:700;margin-top:4px}
.io-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px}
.io-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.io-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.io-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.io-lamp{width:16px;height:16px;border-radius:50%;background:#21262d;border:2px solid #30363d;transition:all 0.2s}
.io-lamp.on{background:var(--green);border-color:#4ade80;box-shadow:0 0 8px rgba(34,197,94,0.6)}
.io-lbl{font-size:10px;color:var(--muted);font-weight:600}
.ctrl-card{display:flex;gap:10px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:transform 0.1s,opacity 0.2s;display:flex;justify-content:center;align-items:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-start{background:var(--green);color:#052e16}
.btn-stop{background:var(--red);color:#fff}
.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand"><span>⚡</span> HAFFLER HT-V3A</div>
    <div id="stateBadge" class="badge badge-idle">IDLE</div>
  </div>
  <div class="hero-card">
    <div class="hero-label">ACTIVE PROCESS METRIC</div>
    <div class="hero-val" id="heroVal">0.0</div>
    <div class="hero-unit" id="heroUnit">MM / POSITION</div>
  </div>
  <div class="grid-2">
    <div class="sub-card">
      <div class="sub-title">CYCLE TIME</div>
      <div class="sub-val" id="cycleTime">00:00.0</div>
    </div>
    <div class="sub-card">
      <div class="sub-title">PIECE COUNTER</div>
      <div class="sub-val" id="pieceCount">0 pcs</div>
    </div>
    <div class="sub-card">
      <div class="sub-title">TEMPERATURE</div>
      <div class="sub-val" id="tempVal">--.- °C</div>
    </div>
    <div class="sub-card">
      <div class="sub-title">INTERNAL DRAM</div>
      <div class="sub-val" id="dramVal">-- KB</div>
    </div>
  </div>
  <div class="io-card">
    <div class="io-title">DIGITAL INPUTS (OPTO I0..I7)</div>
    <div class="io-grid" id="inputLamps"></div>
  </div>
  <div class="io-card">
    <div class="io-title">RELAY OUTPUTS (Q0..Q7)</div>
    <div class="io-grid" id="outputLamps"></div>
  </div>
  <div class="ctrl-card">
    <button class="btn btn-start" onclick="sendCmd('START')">▶ START CYCLE</button>
    <button class="btn btn-stop" onclick="sendCmd('STOP')">■ STOP</button>
  </div>
  <div class="footer">Haffler Enterprise Embedded Telemetry &bull; Zero-Hang Core 0</div>
</div>
<script>
const inpContainer=document.getElementById("inputLamps");
const outContainer=document.getElementById("outputLamps");
for(let i=0;i<8;i++){
  inpContainer.innerHTML+=<div class="io-item"><div class="io-lamp" id="in_"></div><div class="io-lbl">I</div></div>;
  outContainer.innerHTML+=<div class="io-item"><div class="io-lamp" id="out_"></div><div class="io-lbl">Q</div></div>;
}
function updateUI(d){
  if(d.hero!==undefined)document.getElementById("heroVal").innerText=d.hero.toFixed(1);
  if(d.cycle!==undefined)document.getElementById("cycleTime").innerText=d.cycle;
  if(d.pieces!==undefined)document.getElementById("pieceCount").innerText=d.pieces+" pcs";
  if(d.temp!==undefined)document.getElementById("tempVal").innerText=d.temp.toFixed(1)+" °C";
  if(d.dram!==undefined)document.getElementById("dramVal").innerText=d.dram+" KB";
  if(d.state){
    const b=document.getElementById("stateBadge");
    b.innerText=d.state;
    b.className="badge "+(d.state==="RUNNING"?"badge-run":(d.state==="STOPPED"?"badge-stop":"badge-idle"));
  }
  if(d.inputs!==undefined){
    for(let i=0;i<8;i++){
      const el=document.getElementById(in_);
      if(el)el.classList.toggle("on",((d.inputs>>i)&1)===0);
    }
  }
  if(d.outputs!==undefined){
    for(let i=0;i<8;i++){
      const el=document.getElementById(out_);
      if(el)el.classList.toggle("on",((d.outputs>>i)&1)!==0);
    }
  }
}
function sendCmd(cmd){
  fetch('/api/cmd?action='+cmd,{method:'POST'}).catch(e=>console.warn(e));
}
let ws;
function connectWS(){
  ws=new WebSocket('ws://'+window.location.host+'/ws');
  ws.onmessage=e=>{try{updateUI(JSON.parse(e.data));}catch(err){}};
  ws.onclose=()=>setTimeout(connectWS,2000);
}
connectWS();
setInterval(()=>{
  fetch('/api/status').then(r=>r.json()).then(updateUI).catch(()=>{});
},1000);
</script>
</body>
</html>
