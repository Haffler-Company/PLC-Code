; Haffler Industrial Universal PlatformIO Configuration
; ESP32-S3-WROOM-1 (N16R8) - 16MB Octal Flash, 8MB Octal PSRAM, LVGL 9, TFT_eSPI

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino

; Relative path to shared libraries
lib_extra_dirs = 
    C:/Users/Haffler/Documents/Haffler/PLC/PLC HMI/Software/libraries

board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_ota7m.csv
board_build.filesystem = spiffs
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi

upload_speed = 921600
monitor_speed = 921600
upload_protocol = esptool

build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
