; PlatformIO Project Configuration File for Bakery HMI / PLC
; Haffler Industrial Engineering Standard

[platformio]
default_envs = esp32-s3
src_dir = V.1.1.0/ChoneProject

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.psram_type = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 921600
upload_speed = 460800
upload_protocol = esptool
monitor_rts = 0
monitor_dtr = 0
board_upload.wait_for_upload_port = 20
upload_flags = 
	--before=default_reset
	--after=hard_reset

lib_ldf_mode = deep
lib_extra_dirs = 
	../libraries
	V.1.1.0/ChoneProject/libraries

build_src_filter = 
	+<*>
	-<libraries/>

extra_scripts = 
	pre:tools/gen_build_time.py

build_flags = 
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-I V.1.1.0/ChoneProject
	-I V.1.1.0/ChoneProject/libraries
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TOUCH_CS=-1
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_CS=13
	-D TFT_DC=14
	-D TFT_RST=-1
	-D TFT_BL=38
	-D TFT_MISO=37
	-D TFT_MOSI=10
	-D TFT_SCLK=12
	-D SPI_FREQUENCY=80000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_ARCH_ESP32
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections

platform_packages = platformio/tool-esptoolpy@~1.40501.0
